<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Red Rush</title>
    <meta name="description" content="Faça login no sistema Red Rush">
    <link rel="stylesheet" href="../assets/style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bodi">
    <header>
        <nav class="nave" aria-label="Navegação principal">
            <img class="logo" src="../assets/imag/Logo_red_rush.png" alt="Red Rush Logo">
            <h1>Red Rush</h1>
            <img id="gif" src="../assets/imag/trem_gif.gif" alt="GIF animado de um trem">
        </nav>
    </header>

    <main>
        <div class="container">
            <form class="formss" action="/login" method="POST" id="loginForm" novalidate>
                <h2 id="log">Login</h2>
                
                <div class="form-group">
                    <label id="back" for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com" aria-required="true">
                    <div class="invalid-feedback">Por favor, insira um email válido.</div>
                </div>
                
                <div class="form-group">
                    <label id="back" for="password">Senha</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" aria-required="true">
                    <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
                </div>
                
                <div class="check">
                    <input id="chk" type="checkbox" name="remember" id="remember">
                    <label class="ck" for="remember">Lembrar de mim</label>
                </div>
                
                <button id="bot" type="submit">Login</button>
                
                <p class="register-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Red Rush</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/script.js"></script>
</body>
</html>
